name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: pnpm
      - name: Install devDependencies
        run: pnpm install --frozen-lockfile
      - name: Static check
        run: pnpm run check
      - name: Lint
        run: pnpm run lint
      - name: Format check
        run: pnpm run format:check
      - name: Host self-test (real registry round-trip, temp var auto-cleaned)
        run: pnpm test
